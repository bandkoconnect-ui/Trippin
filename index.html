<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trippin — find where to go next</title>
  <meta name="description" content="Trippin is a map-first way to discover your next trip. Set dates, budget, where you start and how you like to travel — and watch the world rearrange itself.">
  <meta name="theme-color" content="#F2EFEA">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trippin">
  <meta property="og:title" content="Trippin">
  <meta property="og:description" content="Every decision reveals a different version of the world.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="map" class="map" aria-label="Interactive world map"></main>

    <header class="topbar">
      <a class="brand" href="./" aria-label="Trippin home"><span class="brand-dot" aria-hidden="true"></span>Trippin</a>
      <button id="briefBtn" class="brief-btn" type="button">
        <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3.8 2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></svg></span>
        <span>Brief</span><span class="count" aria-hidden="true"></span>
      </button>
    </header>

    <section id="caption" class="caption" aria-live="polite" aria-label="What the map shows"></section>
    <div id="mapstatus" class="map-status" role="status"></div>
    <div id="zoomctl" class="zoomctl" role="group" aria-label="Map zoom"></div>

    <section id="editor" class="editor" role="tabpanel"></section>
    <nav id="dock" class="dock" role="tablist" aria-label="Travel parameters"></nav>

    <aside id="sheet" class="sheet" aria-hidden="true"></aside>
    <div id="brief" class="brief" aria-hidden="true"></div>

    <div id="tooltip" class="tooltip" role="presentation"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><p style="padding:24px;font-family:Helvetica Neue,Helvetica,Arial,sans-serif">Trippin needs JavaScript to draw the map.</p></noscript>
  <script src="js/vendor/d3.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
